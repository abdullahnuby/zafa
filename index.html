<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff1f3" />
  <meta name="description" content="زفّة — سيارات مناسبات بسائق، وتجربة مبهجة تبدأ من أول اختيار." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">{"imports":{"@neondatabase/auth":"https://esm.sh/@neondatabase/auth@0.7.0-beta?bundle"}}</script>
  <title>زفّة | ZAFFA</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <a class="brand" href="#home" aria-label="زفّة الرئيسية">
        <img class="brand-logo" src="/logo.svg" alt="زفّة ZAFFA" />
      </a>
      <div class="sidebar-caption">مساحة العمل</div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-icon">؟</span><div><b>محتاج مساعدة؟</b><small>فريق زفّة معاك خطوة بخطوة</small></div></div>
        <div class="prototype-note">الإطلاق التمهيدي — تجهيز السيارات والتوافر</div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-brand" data-action="go" data-view="home" aria-label="زفّة الرئيسية"><img class="mobile-brand-logo" src="/icon.svg" alt="" /><span class="mobile-brand-wordmark">زفّة</span></button>
        <div class="breadcrumb"><span>زفّة</span><i>/</i><b id="page-title">الرئيسية</b></div>
        <div class="top-actions">
          <button id="account-button" class="account-button" data-action="account" aria-label="تسجيل الدخول أو إدارة الحساب">تسجيل الدخول</button>
        </div>
      </header>
      <section class="content-wrap"><div id="app-content" aria-live="polite"></div></section>
      <nav id="mobile-nav" class="mobile-nav" aria-label="التنقل"></nav>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
