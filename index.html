<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#172b3a" />
  <meta name="description" content="زفّة — سيارات مناسبات بسائق، بتجربة حجز راقية وواضحة." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <title>زفّة | ZAFFA</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <a class="brand" href="#home" aria-label="زفّة الرئيسية">
        <span class="brand-mark">ز</span>
        <span><b>زفّة</b><small>ZAFFA</small></span>
      </a>
      <div class="sidebar-caption">مساحة العمل</div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-icon">؟</span><div><b>محتاج مساعدة؟</b><small>فريق زفّة معاك خطوة بخطوة</small></div></div>
        <div class="prototype-note">نسخة تجريبية — بيانات محلية</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-brand" data-action="go" data-view="home"><span class="brand-mark">ز</span><b>زفّة</b></button>
        <div class="breadcrumb"><span>زفّة</span><i>/</i><b id="page-title">الرئيسية</b></div>
        <div class="top-actions">
          <span class="demo-chip"><span></span> وضع تجريبي</span>
          <button class="icon-button" data-action="toast" data-message="مركز التنبيهات — نموذج تجريبي" aria-label="التنبيهات">♧</button>
          <div class="role-switcher">
            <label for="role-select">عرض الواجهة</label>
            <select id="role-select" aria-label="اختيار الدور">
              <option value="customer">عميل</option>
              <option value="owner">مالك سيارة</option>
              <option value="driver">سائق</option>
              <option value="admin">إدارة زفّة</option>
            </select>
          </div>
          <div class="avatar">م</div>
        </div>
      </header>

      <section class="content-wrap">
        <div id="app-content" aria-live="polite"></div>
      </section>
      <nav id="mobile-nav" class="mobile-nav" aria-label="التنقل"></nav>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
