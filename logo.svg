<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" aria-labelledby="title desc">
<title id="title">زفّة | ZAFFA</title>
<desc id="desc">شعار زفّة: ماسة وخاتما زواج فوق سيارة مناسبات محاطة بقوس احتفالي، مع الاسم العربي والإنجليزي</desc>
<defs>
  <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3d9ad"/>
    <stop offset=".5" stop-color="#d7ad76"/>
    <stop offset="1" stop-color="#b98257"/>
  </linearGradient>
  <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a87588"/>
    <stop offset="1" stop-color="#755064"/>
  </linearGradient>
</defs>

