name: ZAFFA quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [productize/brand-payments-auth]
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check booking-rules.mjs
          find api lib -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Unit tests
        run: npm test
